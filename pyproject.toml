[project]
name = "agentbeats"
version = "0.1.0"
description = "FutureBench-Finance evaluator and predictor scaffolding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.8",
    "typer>=0.12",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tomli>=2.0",
    "litellm>=1.41.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",
    "tavily-python>=0.5.0",
    "beautifulsoup4>=4.12",
    "ta>=0.11.0",
    "joblib>=1.4",
    "huggingface-hub>=0.24.0",
    "a2a-sdk[http-server]>=0.3.20",
    "uvicorn>=0.38.0",
]

[project.scripts]
agentbeats = "agentbeats.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
